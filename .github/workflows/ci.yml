name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Black formatting check
        run: |
          black --check --target-version py312 app/ tests/

      - name: Check import order (isort)
        run: |
          isort app/ tests/ --check-only --diff

      - name: Run flake8
        run: |
          flake8 app/ tests/

      - name: Enforce module boundaries (import-linter)
        run: |
          lint-imports

  # ============================================================================
  # Type Checking
  # ============================================================================
  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run mypy strict
        run: |
          mypy app/ --strict --show-error-codes --pretty --explicit-package-bases

      - name: Run mypy on selected critical modules
        run: |
          mypy app/middleware/ app/services/task_execution/ --strict --show-error-codes --explicit-package-bases

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -ll

      - name: Check for known vulnerabilities
        run: |
          safety check --json --output safety-report.json || true
          # SFTY-20260902-58666: nltk is installed only as a dependency of `safety`
          # itself (CI tooling, not shipped with the API); no patched release yet.
          safety check --ignore=SFTY-20260902-58666

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-report.json
            safety-report.json

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apgi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apgi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/apgi_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v --tb=short

  # ============================================================================
  # Property-Based Tests
  # ============================================================================
  test-property:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run property-based tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          pytest tests/property/ -v --tb=short -x

  # ============================================================================
  # Named release gates (XC-CI-06). Each is its own job so branch protection can
  # require it by name: gate-migrations, gate-contract, gate-auth, gate-consent,
  # gate-ingestion, gate-exposure, gate-boundaries, gate-restore.
  # ============================================================================
  gate-migrations:
    name: gate-migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apgi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/apgi_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Empty database migrates to a single head
        run: alembic upgrade head
      - name: Migrated schema is structurally identical to the ORM
        run: PYTHONPATH=. python scripts/check_migration_drift.py
      - name: Newest migrations downgrade and re-upgrade
        run: |
          alembic downgrade -2
          alembic upgrade head

  gate-contract:
    name: gate-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Frozen OpenAPI v1 has not drifted
        run: PYTHONPATH=. python scripts/export_openapi.py --check
      - name: JSON Schemas match live models; fixtures validate
        run: pytest tests/unit/test_contracts.py tests/unit/test_release_gates.py -q

  gate-auth:
    name: gate-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_authorization.py tests/unit/test_authorization_coverage.py tests/integration/test_middleware_stack.py -q

  gate-consent:
    name: gate-consent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_governance_tables.py tests/integration/test_research_pilot_integration.py -q

  gate-ingestion:
    name: gate-ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_explorer_contract.py tests/integration/test_item_responses.py tests/integration/test_research_pilot_integration.py -q

  gate-exposure:
    name: gate-exposure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Outbound fields absent from the allow-list raise; audit chain verifies
        run: pytest tests/unit/test_exposure_gate.py tests/unit/test_audit_chain.py tests/unit/test_version_lattice.py -q

  gate-boundaries:
    name: gate-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: lint-imports

  gate-restore:
    name: gate-restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Erasure ledger and restore-replay acceptance
        run: pytest tests/unit/test_erasure_ledger.py -q

  # ============================================================================
  # Build & Package
  # ============================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, gate-migrations, gate-contract, gate-auth, gate-consent, gate-ingestion, gate-exposure, gate-boundaries, gate-restore]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================================
  # Canonical Identifiers Divergence Check
  # ============================================================================
  identifiers:
    name: Identifiers Divergence Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check README.md, CITATION.cff, .zenodo.json match identifiers.yaml
        run: |
          python scripts/generate_identifiers.py --check

  # ============================================================================
  # Documentation Build
  # ============================================================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: docs/*.md README.md --timeout 30
          fail: false

      - name: Check for broken internal references
        run: |
          # Check that all doc files referenced exist
          for file in docs/*.md; do
            echo "Checking $file..."
            # Extract markdown links and verify they exist
            grep -oE '\[.*\]\(([^)]+)\)' "$file" | grep -vE '(http|https|mailto)' | while read -r match; do
              link=$(echo "$match" | sed 's/.*(\(.*\)).*/\1/' | sed 's/#.*//')
              if [ -n "$link" ] && [ ! -f "docs/$link" ] && [ ! -f "$link" ]; then
                echo "Broken link in $file: $link"
                exit 1
              fi
            done
          done
          echo "All internal references valid!"
