[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apgi-api"
version = "1.0.0"
description = "Standalone REST API for the APGI system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "APGI Team", email = "team@apgi.example.com"}
]
keywords = ["api", "rest", "fastapi", "consciousness", "cognitive-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "starlette>=0.37.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "kombu>=5.3.4",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.5",
    "faker>=20.0.0",
    # Hard runtime deps of app.routes.payments / app.services.auth_manager —
    # previously missing here, which made `pip install -e ".[dev]"` (as used
    # throughout .github/workflows/ci.yml) fail to import the app at all.
    "stripe>=7.0.0",
    "pyotp>=2.9.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.1",
    "locust>=2.20.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "isort>=5.13.0",
    "types-psutil>=5.9.0",
    "types-PyYAML>=6.0.0",
    "types-psycopg2>=2.9.0",
]

[project.scripts]
apgi-api = "app.main:cli"
apgi-migrate = "app.cli:migrate"
apgi-worker = "app.cli:worker"
apgi-seed = "app.cli:seed"
apgi-clear-seed = "app.cli:clear_seed_data"

[project.urls]
Homepage = "https://apgiframework.com"
Documentation = "https://github.com/apgiframework/apgi-api/tree/main/docs"
Repository = "https://github.com/apgiframework/apgi-api"
Issues = "https://github.com/apgiframework/apgi-api/issues"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["py.typed", "templates/*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app"]

[tool.mypy]
python_version = 3.14
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict = true
explicit_package_bases = true
files = ["app"]
exclude = [
    "^/opt/",
    "^/usr/",
    "^/homebrew/",
    "^/opt/homebrew/",
    "^app/tests/",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "redis.*",
    "prometheus_client.*",
    "apgi_system.*",
    "apgi_gui.*",
    "opentelemetry.instrumentation.celery",
    "opentelemetry.instrumentation.httpx",
    "sphinx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "psutil",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing --cov-report=html --ignore=tests/load --ignore=tests/test_load.py --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
    "slow: Slow running tests",
    "load: Load and performance tests",
]
filterwarnings = [
    # Suppress Google SDK's pkg_resources deprecation warning (external dependency)
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    # Suppress OpenTelemetry metaclass warning on Python 3.14 (known limitation)
    "ignore:OpenTelemetry not available:UserWarning",
    # Ignore experimental module warnings (expected when apgi_system not installed)
    "ignore:apgi_system not available:UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
